# $uri is percent-decoded and normalized by nginx. Allow only known discovery paths.
map $uri $baitly_sensitive_path {
    default 0;
    ~^/\.well-known/(api-catalog|oauth-protected-resource|openid-configuration|oauth-authorization-server|assetlinks\.json|apple-app-site-association|security\.txt)$ 0;
    ~^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ 0;
    ~^/\.well-known/agent-skills/([A-Za-z0-9_-][A-Za-z0-9_.-]*/?)*$ 0;
    ~^/realms/[A-Za-z0-9_-]+/\.well-known/(openid-configuration|oauth-authorization-server)$ 0;
    ~/\. 1;
    ~*\.(env|log|sql|bak|swp|swo)(~|$) 1;
}
map "$scheme:$uri" $baitly_acme_request {
    default 0;
    ~^http:/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ 1;
}
# Empty keys are not accounted: refresh, callbacks and webhooks keep their own limits.
map "$request_method:$uri" $baitly_login_key {
    default "";
    ~^POST:/api/auth/(login|forgot-password|password-reset-email)$ $binary_remote_addr;
    ~^POST:/realms/[^/]+/login-actions/(authenticate|reset-credentials)$ $binary_remote_addr;
}
# Keep route categories, never arbitrary path segments (invites/media/document tokens).
map $uri $baitly_log_path {
    default "/[redacted]";
    / /;
    /health /health;
    /baitly-config.js /baitly-config.js;
    /api/auth/login /api/auth/login;
    /api/auth/forgot-password /api/auth/forgot-password;
    /api/auth/password-reset-email /api/auth/password-reset-email;
    ~/\.(?!well-known/) "/[sensitive-file-probe]";
    ~^/api/ "/api/[redacted]";
    ~^/realms/ "/oidc/[redacted]";
    ~^/assets/ "/assets/[redacted]";
}
