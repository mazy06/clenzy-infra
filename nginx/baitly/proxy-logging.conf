# Baitly diagnostic allowlist. Do not add raw request, host, IP or header fields.
map $request_method $baitly_log_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
map $uri $baitly_log_path {
    default "/[redacted]";
    / /;
    /health /health;
    /baitly-config.js /baitly-config.js;
    /api/auth/login /api/auth/login;
    /api/auth/forgot-password /api/auth/forgot-password;
    /api/auth/password-reset-email /api/auth/password-reset-email;
    ~/\.(?!well-known/) "/[sensitive-file-probe]";
    ~^/api/ "/api/[redacted]";
    ~^/realms/ "/oidc/[redacted]";
    ~^/assets/ "/assets/[redacted]";
}

log_format baitly_security escape=json
    '{"diagnostic":"BAITLY_PROXY_ACCESS","timestamp":"$time_iso8601",'
    '"method":"$baitly_log_method","path":"$baitly_log_path","status":$status,'
    '"upstream_status":"$upstream_status","request_time":$request_time}';
access_log /var/log/nginx/access.log baitly_security;
