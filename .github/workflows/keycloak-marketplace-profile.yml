name: Keycloak Marketplace Profile

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Instance cible (environnement GitHub)"
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - production-baitly
      dry_run:
        description: Vérifier sans modifier le profil
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: keycloak-marketplace-profile-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester la configuration du profil
        run: python3 -B -m unittest discover -s keycloak -p test_marketplace_profile.py -v
      - name: Vérifier le script shell
        run: bash -n keycloak/sync-marketplace-profile.sh
  profile:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target || 'production' }}
    steps:
      - name: Synchroniser le profil Baitly
        uses: appleboy/ssh-action@v1
        env:
          SSH_HOST: ${{ secrets.VPS_HOST != '' && secrets.VPS_HOST || vars.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER != '' && secrets.VPS_USER || vars.VPS_USER }}
          INFRA_DIR_VALUE: ${{ vars.VPS_INFRA_DIR }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: INFRA_DIR_VALUE,DRY_RUN,DEPLOY_SHA
          script: |
            set -eu
            INFRA_DIR="${INFRA_DIR_VALUE:-$HOME/clenzy-infra}"
            cd "$INFRA_DIR"
            git fetch origin production
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/production
            # Extraire les scripts de la branche déployable sans réinitialiser le checkout du serveur.
            TEMP_DIR=$(mktemp -d)
            trap 'rm -rf "$TEMP_DIR"' EXIT
            git show "$DEPLOY_SHA:keycloak/sync-marketplace-profile.py" > "$TEMP_DIR/sync-marketplace-profile.py"
            set +x
            set -a
            . ./.env
            set +a
            if [ "$DRY_RUN" = "true" ]; then
              python3 "$TEMP_DIR/sync-marketplace-profile.py" --dry-run
            else
              python3 "$TEMP_DIR/sync-marketplace-profile.py"
            fi
