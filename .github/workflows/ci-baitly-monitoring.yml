name: CI Baitly monitoring (no deployment)
on:
  pull_request:
    paths: ['monitoring/prometheus/**', 'monitoring/alertmanager/**', 'scripts/baitly-pilot-monitoring.py', 'scripts/tests/test_baitly_pilot_monitoring.py', 'scripts/deploy.sh', 'scripts/baitly-alertmanager-token.sh', '.github/workflows/ci-baitly-monitoring.yml', '.github/workflows/baitly-pilot-staging.yml']
  push:
    branches: [main]
    paths: ['monitoring/prometheus/**', 'monitoring/alertmanager/**', 'scripts/baitly-pilot-monitoring.py', 'scripts/tests/test_baitly_pilot_monitoring.py', 'scripts/deploy.sh', 'scripts/baitly-alertmanager-token.sh', '.github/workflows/ci-baitly-monitoring.yml', '.github/workflows/baitly-pilot-staging.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test reload and staging qualification safeguards
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_baitly_pilot_monitoring.py'
          bash -n scripts/deploy.sh scripts/baitly-alertmanager-token.sh
      - name: Validate Prometheus rules and simulate incidents and recoveries
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/work:ro" -w /work/tests prom/prometheus:v2.51.0 check rules /work/rules/clenzy-alerts.yml /work/rules/baitly-recovery.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/work:ro" -w /work/tests prom/prometheus:v2.51.0 test rules baitly-pilot.test.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/work:ro" -w /work/tests prom/prometheus:v2.51.0 test rules baitly-recovery.test.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/work:ro" -w /work/tests prom/prometheus:v2.51.0 test rules baitly-minut.test.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/work:ro" -w /work/tests prom/prometheus:v2.51.0 test rules baitly-noise-warning.test.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/work:ro" -w /work/tests prom/prometheus:v2.51.0 test rules baitly-automation.test.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/work:ro" -w /work/tests prom/prometheus:v2.51.0 test rules baitly-external-effects.test.yml
      - name: Validate Alertmanager routing without sending notifications
        run: |
          mkdir -p "$RUNNER_TEMP/baitly-alertmanager"
          cp monitoring/alertmanager/alertmanager.yml "$RUNNER_TEMP/baitly-alertmanager/alertmanager.yml"
          CLENZY_OPS_ALERT_TOKEN=ci-fixture-not-a-secret bash scripts/baitly-alertmanager-token.sh "$RUNNER_TEMP/baitly-alertmanager/ops_token"
          test "$(stat -c %a "$RUNNER_TEMP/baitly-alertmanager/ops_token")" = 640
          test "$(stat -c %g "$RUNNER_TEMP/baitly-alertmanager/ops_token")" = 65534
          # The real default container user must read the credential; no root override.
          docker run --rm --entrypoint sh -v "$RUNNER_TEMP/baitly-alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.27.0 -ec 'test "$(id -u)" = 65534; test -r /etc/alertmanager/ops_token; test "$(cat /etc/alertmanager/ops_token)" = ci-fixture-not-a-secret'
          # Rotation must also preserve content, permissions, and container readability.
          CLENZY_OPS_ALERT_TOKEN=ci-rotated-fixture bash scripts/baitly-alertmanager-token.sh "$RUNNER_TEMP/baitly-alertmanager/ops_token"
          docker run --rm --entrypoint sh -v "$RUNNER_TEMP/baitly-alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.27.0 -ec 'test -r /etc/alertmanager/ops_token; test "$(cat /etc/alertmanager/ops_token)" = ci-rotated-fixture'
          docker run --rm --entrypoint amtool -v "$RUNNER_TEMP/baitly-alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint amtool -v "$RUNNER_TEMP/baitly-alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.27.0 config routes test --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers=clenzy-inapp alertname=BaitlyOutboxExhausted severity=critical job=clenzy-backend
          for alert in BaitlyRecoveryMetricsUnavailable BaitlyRecoveryMetricsStale BaitlyAccountingExportStalled BaitlyAccountingExportUncertain BaitlyMinutRecoveryStalled BaitlyMinutRecoveryUncertain BaitlyNoiseWarningMetricsUnavailable BaitlyNoiseWarningUncertain BaitlyNoiseWarningRepairStalled BaitlyAutomationMetricsUnavailable BaitlyAutomationStalled BaitlyAutomationUncertain BaitlyAutomationReviewRequired BaitlyExternalEffectMetricsUnavailable BaitlyLockEffectUncertain BaitlyReportEffectUncertain BaitlyReportEffectPartial; do
            docker run --rm --entrypoint amtool -v "$RUNNER_TEMP/baitly-alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.27.0 config routes test --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers=clenzy-inapp alertname="$alert" severity=warning job=clenzy-backend
          done
