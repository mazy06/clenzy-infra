# ===========================================
# Clenzy - DB Status (Liquibase read-only)
# ===========================================
# Phase 1 du plan de reactivation de SPRING_LIQUIBASE_ENABLED=true en prod.
#
# Objectif : visibilite continue sur l'etat de synchronisation entre
# `databasechangelog` (prod) et le master changelog du repo applicatif, SANS
# rien modifier. Sert de prerequis aux phases suivantes (audit baseline, check
# CI, activation boot Liquibase).
#
# Ce workflow :
#   1. Lance un container Liquibase 4.29.2 en read-only sur le reseau prod.
#   2. Execute `status --verbose` (changesets non appliques) et `validate`
#      (checksums divergents, syntaxe).
#   3. Dump les 10 derniers changesets traces + total count.
#   4. FAIL si :
#        - des changesets sont pending
#        - liquibase validate signale un mismatch / une erreur
#
# Trigger :
#   - workflow_dispatch (manuel)
#   - cron quotidien 06:00 UTC -> mail GitHub Actions a l'owner si fail
#
# IMPORTANT : aucune ecriture (pas de `update`, pas de `changelog-sync`,
# pas de DML). Si une desync est detectee, appliquer via le workflow
# `Liquibase Bootstrap` apres revue.
#
# Securite : les inputs workflow_dispatch ne sont declenchables que par les
# users avec write access. Aucune entree provenant de github.event.* (issue,
# pr, commit message) n'est utilisee dans un `run:`.

name: DB Status

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Affiche aussi les 10 derniers changesets traces'
        required: false
        default: true
        type: boolean
      liquibase_image:
        description: 'Image Liquibase a utiliser'
        required: false
        default: 'liquibase/liquibase:4.29.2'
        type: string
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  status:
    name: Read-only Liquibase status
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Run Liquibase status + validate on VPS
        uses: appleboy/ssh-action@v1
        env:
          INFRA_DIR_VALUE: ${{ vars.VPS_INFRA_DIR }}
          LIQUIBASE_IMAGE: ${{ inputs.liquibase_image || 'liquibase/liquibase:4.29.2' }}
          VERBOSE_DUMP: ${{ inputs.verbose && 'true' || 'false' }}
        with:
          host: ${{ secrets.VPS_HOST != '' && secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USER != '' && secrets.VPS_USER || vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: INFRA_DIR_VALUE,LIQUIBASE_IMAGE,VERBOSE_DUMP
          command_timeout: 5m
          script: |
            set -e

            INFRA_DIR="${INFRA_DIR_VALUE:-$HOME/clenzy-infra}"
            CLENZY_DIR="$(cd "$INFRA_DIR/.." && pwd)/clenzy"
            # IMPORTANT (Phase 5b-bis 2026-05-21) : on monte 'resources' (et pas
            # 'resources/db/changelog') pour que le filename interne stocke par
            # Liquibase soit "db/changelog/db.changelog-master.yaml" — meme path
            # que Spring Boot calcule avec change-log=classpath:db/changelog/...
            # Sans cet alignement, Liquibase status (avec path court) vs
            # databasechangelog (avec path long, apres restamp) ne matchent pas
            # → faux positif "118 changesets pending".
            RESOURCES_DIR="$CLENZY_DIR/server/src/main/resources"
            CHANGELOG_DIR="$RESOURCES_DIR/db/changelog"
            DC="docker compose -f $INFRA_DIR/docker-compose.prod.yml --env-file $INFRA_DIR/.env"

            echo "=========================================="
            echo "DB Status (read-only)"
            echo "=========================================="
            echo "INFRA_DIR    : $INFRA_DIR"
            echo "CLENZY_DIR   : $CLENZY_DIR"
            echo "CHANGELOG    : $CHANGELOG_DIR"
            echo "IMAGE        : $LIQUIBASE_IMAGE"
            echo "VERBOSE_DUMP : $VERBOSE_DUMP"

            if [ ! -f "$INFRA_DIR/.env" ]; then
              echo "::error::Fichier .env manquant dans $INFRA_DIR"
              exit 1
            fi
            if [ ! -f "$CHANGELOG_DIR/db.changelog-master.yaml" ]; then
              echo "::error::Master changelog introuvable : $CHANGELOG_DIR/db.changelog-master.yaml"
              echo "Declencher un CD Deploy pour resynchroniser le repo clenzy avant de relancer."
              exit 1
            fi

            set -a
            . "$INFRA_DIR/.env"
            set +a

            if [ -z "$POSTGRES_USER" ] || [ -z "$POSTGRES_PASSWORD" ] || [ -z "$POSTGRES_DB" ]; then
              echo "::error::POSTGRES_USER/PASSWORD/DB manquant dans .env"
              exit 1
            fi

            PG_STATE=$($DC ps --format '{{.State}}' postgres 2>/dev/null || echo "missing")
            if [ "$PG_STATE" != "running" ]; then
              echo "::error::Container postgres non running (state=$PG_STATE)"
              exit 1
            fi

            JDBC_URL="jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=prefer"

            # Mount RESOURCES_DIR (et pas CHANGELOG_DIR) sous /liquibase/resources
            # avec --changelog-file=db/changelog/db.changelog-master.yaml. Cela
            # produit le meme filename interne que Spring Boot
            # (classpath:db/changelog/db.changelog-master.yaml). Les sqlFile
            # relatifs (relativeToChangelogFile: true) restent resolves
            # correctement car ils sont dans /liquibase/resources/db/changelog/changes/.
            run_liquibase() {
              docker run --rm \
                --network clenzy-network \
                -v "$RESOURCES_DIR":/liquibase/resources:ro \
                -w /liquibase/resources \
                "$LIQUIBASE_IMAGE" \
                --url="$JDBC_URL" \
                --username="$POSTGRES_USER" \
                --password="$POSTGRES_PASSWORD" \
                --changelog-file=db/changelog/db.changelog-master.yaml \
                --log-level=INFO \
                "$@"
            }

            STATUS_OUT="/tmp/db-status-$$.log"
            VALIDATE_OUT="/tmp/db-validate-$$.log"
            trap 'rm -f "$STATUS_OUT" "$VALIDATE_OUT"' EXIT

            STATUS_RC=0
            VALIDATE_RC=0

            echo ""
            echo "[1/8] liquibase status --verbose"
            run_liquibase status --verbose 2>&1 | tee "$STATUS_OUT" || STATUS_RC=$?

            echo ""
            echo "[2/8] liquibase validate"
            run_liquibase validate 2>&1 | tee "$VALIDATE_OUT" || VALIDATE_RC=$?

            echo ""
            echo "[3/8] databasechangelog metrics"
            TOTAL=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT count(*) FROM databasechangelog;" 2>/dev/null | tr -d '[:space:]' || echo "?")
            LAST_DATE=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT max(dateexecuted) FROM databasechangelog;" 2>/dev/null | tr -d '[:space:]' || echo "?")
            LOCK_STATE=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT locked FROM databasechangeloglock WHERE id=1;" 2>/dev/null | tr -d '[:space:]' || echo "?")

            echo "Total tracked changesets : $TOTAL"
            echo "Last exec date           : $LAST_DATE"
            echo "Changelog lock state     : $LOCK_STATE"

            if [ "$VERBOSE_DUMP" = "true" ]; then
              echo ""
              echo "Last 10 tracked changesets :"
              $DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "SELECT id, author, exectype, dateexecuted, tag FROM databasechangelog ORDER BY orderexecuted DESC LIMIT 10;" \
                2>&1 || true
            fi

            echo ""
            echo "[4/8] controles d'integrite pre-migration (lecture seule)"
            # Le changeset 0361 pose des contraintes UNIQUE sur payment_transactions et
            # REFUSE de s'appliquer si des doublons existent — un changeset qui echoue
            # empeche l'application de demarrer. Ces deux requetes disent, AVANT tout
            # deploiement, si la voie est libre. Elles ne modifient rien.
            # Audit securite 2026-07-26, controle CTRL-1.
            DUP_REF=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT count(*) FROM (SELECT transaction_ref FROM payment_transactions \
               GROUP BY transaction_ref HAVING count(*) > 1) d;" 2>/dev/null | tr -d '[:space:]' || echo "?")
            DUP_IDEM=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT count(*) FROM (SELECT idempotency_key FROM payment_transactions \
               WHERE idempotency_key IS NOT NULL \
               GROUP BY idempotency_key HAVING count(*) > 1) d;" 2>/dev/null | tr -d '[:space:]' || echo "?")

            echo "Doublons transaction_ref  : $DUP_REF"
            echo "Doublons idempotency_key  : $DUP_IDEM"

            if [ "$DUP_REF" != "0" ] || [ "$DUP_IDEM" != "0" ]; then
              echo "ATTENTION : le changeset 0361 echouera et l'application ne demarrera pas."
              echo "            Auditer ces lignes AVANT de deployer — sur des donnees"
              echo "            financieres, un doublon s'audite, il ne se fusionne pas."
              if [ "$VERBOSE_DUMP" = "true" ]; then
                echo ""
                echo "Detail des doublons de transaction_ref :"
                $DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
                  "SELECT transaction_ref, count(*) AS occurrences, \
                          string_agg(id::text, ', ' ORDER BY id) AS ids, \
                          string_agg(DISTINCT status, ', ') AS statuts \
                     FROM payment_transactions GROUP BY transaction_ref \
                    HAVING count(*) > 1 ORDER BY occurrences DESC;" 2>&1 || true
                echo ""
                echo "Detail des doublons d'idempotency_key :"
                $DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
                  "SELECT idempotency_key, count(*) AS occurrences, \
                          string_agg(id::text, ', ' ORDER BY id) AS ids, \
                          sum(amount) AS montant_cumule, \
                          string_agg(DISTINCT currency, ', ') AS devises \
                     FROM payment_transactions WHERE idempotency_key IS NOT NULL \
                    GROUP BY idempotency_key HAVING count(*) > 1 ORDER BY occurrences DESC;" 2>&1 || true
              fi
            fi

            echo ""
            echo "[5/8] escrows liberes jamais reversés (controle CTRL-2)"
            # Jusqu'au correctif P1-14, chaque liberation d'escrow echouait en silence :
            # SplitPaymentService appelait getRequiredOrganizationId() sur un thread Kafka
            # ou le contexte est vide, et l'exception etait avalee. Proprietaires et
            # concierges n'ont donc jamais ete credites par le split automatique.
            #
            # Le correctif rend ce chemin fonctionnel pour l'AVENIR — il ne rattrape rien.
            # Ce controle mesure l'arriere. Lecture seule : il ne credite personne, le
            # rattrapage etant une decision de gestion, pas une operation technique.
            ESCROWS_ORPHELINS=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT count(*) FROM escrow_holds eh \
                WHERE eh.status = 'RELEASED' AND eh.reservation_id IS NOT NULL \
                  AND NOT EXISTS (SELECT 1 FROM ledger_entries le \
                                   WHERE le.reference_type = 'SPLIT' \
                                     AND le.reference_id = 'SPLIT-RES-' || eh.reservation_id);" \
              2>/dev/null | tr -d '[:space:]' || echo "?")

            echo "Escrows liberes sans split : $ESCROWS_ORPHELINS"

            if [ "$ESCROWS_ORPHELINS" != "0" ] && [ "$ESCROWS_ORPHELINS" != "?" ]; then
              echo "  → arriere financier : ces reversements n'ont jamais eu lieu."
              echo "    Le rattrapage crediterait reellement des wallets — decision de gestion,"
              echo "    pas operation technique. Voir REMEDIATION-PLAN.md, CTRL-2."
              $DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
                "SELECT eh.organization_id, eh.currency, count(*) AS escrows, \
                        sum(eh.amount) AS montant_total, \
                        min(eh.released_at) AS plus_ancien, max(eh.released_at) AS plus_recent \
                   FROM escrow_holds eh \
                  WHERE eh.status = 'RELEASED' AND eh.reservation_id IS NOT NULL \
                    AND NOT EXISTS (SELECT 1 FROM ledger_entries le \
                                     WHERE le.reference_type = 'SPLIT' \
                                       AND le.reference_id = 'SPLIT-RES-' || eh.reservation_id) \
                  GROUP BY eh.organization_id, eh.currency \
                  ORDER BY montant_total DESC;" 2>&1 || true
            fi

            echo ""
            echo "[6/8] pages publiees portant l'ancienne URL media (controle P1-06)"
            # La route /api/public/media/{id} est anonyme et l'identifiant sequentiel : toute
            # la mediatheque est enumerable. Elle a ete remplacee par un jeton opaque, mais ne
            # peut pas etre retiree tant que des pages publiees la referencent — leurs images
            # deviendraient introuvables.
            # Le compteur cote application (log MEDIA/P1-06) mesure l'usage reel ; cette
            # requete mesure la cause. Les deux doivent etre a zero avant tout retrait.
            PAGES_ANCIENNE_URL=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT count(*) FROM site_pages \
                WHERE published_blocks IS NOT NULL \
                  AND published_blocks ~ '/api/public/media/[0-9]';" 2>/dev/null | tr -d '[:space:]' || echo "?")

            echo "Pages publiees a republier : $PAGES_ANCIENNE_URL"

            if [ "$PAGES_ANCIENNE_URL" != "0" ] && [ "$PAGES_ANCIENNE_URL" != "?" ]; then
              echo "  → la route heritee ne peut PAS etre retiree : ces pages perdraient leurs"
              echo "    images. Les republier depuis le Studio pour qu'elles adoptent le jeton."
            fi

            echo ""
            echo "[7/8] role applicatif non-superuser (plan REM-T-02)"
            # Repond a trois questions, dans l'ordre du deploiement :
            #   1. le role existe-t-il, et est-il bien NOSUPERUSER / NOBYPASSRLS ?
            #      (un superuser contournerait la RLS meme posee et FORCEE)
            #   2. le changeset 0362 lui a-t-il accorde ses privileges DML ?
            #   3. l'application s'y connecte-t-elle deja (etape 2 effective) ?
            # Lecture seule.
            ROLE_INFO=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT rolsuper || '|' || rolbypassrls || '|' || rolcanlogin \
                 FROM pg_roles WHERE rolname = 'clenzy_app';" 2>/dev/null | tr -d '[:space:]' || echo "")

            if [ -z "$ROLE_INFO" ]; then
              echo "Role clenzy_app          : ABSENT — etape 1 non effectuee"
              echo "                           (poser CLENZY_APP_DB_PASSWORD dans le .env,"
              echo "                            puis deployer avec force_env_sync=true)"
            else
              R_SUPER=$(echo "$ROLE_INFO" | cut -d'|' -f1)
              R_BYPASS=$(echo "$ROLE_INFO" | cut -d'|' -f2)
              R_LOGIN=$(echo "$ROLE_INFO" | cut -d'|' -f3)
              echo "Role clenzy_app          : present"
              echo "  rolsuper               : $R_SUPER  (attendu f)"
              echo "  rolbypassrls           : $R_BYPASS  (attendu f)"
              echo "  rolcanlogin            : $R_LOGIN  (attendu t)"
              if [ "$R_SUPER" = "t" ] || [ "$R_BYPASS" = "t" ]; then
                echo "  ATTENTION : ce role contournerait la RLS. Activer la RLS dans cet"
                echo "              etat donnerait une protection purement illusoire."
              fi

              GRANTS=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
                "SELECT count(DISTINCT table_name) FROM information_schema.role_table_grants \
                  WHERE grantee = 'clenzy_app' AND privilege_type = 'SELECT';" 2>/dev/null | tr -d '[:space:]' || echo "?")
              echo "  tables lisibles        : $GRANTS"
              if [ "$GRANTS" = "0" ]; then
                echo "  → privileges non accordes : le changeset 0362 n'est pas encore deploye."
                echo "    NE PAS basculer l'application tant que ce compteur est a 0."
              fi
            fi

            APP_CONN=$($DC exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
              "SELECT coalesce(string_agg(DISTINCT usename, ', '), 'aucune') \
                 FROM pg_stat_activity WHERE datname = '$POSTGRES_DB' AND usename IS NOT NULL;" 2>/dev/null || echo "?")
            echo "Comptes connectes a la base : $APP_CONN"

            # Parse pending count from `status` output (line "X changesets have not been applied")
            PENDING_RAW=$(grep -oE '^[0-9]+ changesets? have not been applied' "$STATUS_OUT" | grep -oE '^[0-9]+' | head -1 || true)
            PENDING_RAW=${PENDING_RAW:-0}

            # Certains changesets sont listes « not applied » a chaque execution, par
            # conception — les compter comme un ecart rendrait ce workflow rouge en
            # permanence, y compris son execution planifiee, et l'alerte finirait par
            # etre ignoree. On les exclut nommement plutot que d'assouplir le seuil :
            #   0345 : pose la RLS, volontairement dormant tant que le contexte `rls`
            #          n'est pas actif (voir plan REM-T-01) ;
            #   0362 : runAlways — rejoue a chaque boot pour accorder les privileges au
            #          role applicatif meme s'il est cree apres coup. Idempotent.
            # Toute AUTRE ligne en attente reste un ecart reel et fait echouer le job.
            EXPECTED_PENDING='0345-enable-rls-priority-tables|0362-grant-privileges-to-app-role'
            UNEXPECTED=$(grep -oE 'db\.changelog-master\.yaml::[^:]+::' "$STATUS_OUT" \
                          | grep -vE "$EXPECTED_PENDING" | wc -l | tr -d '[:space:]')
            PENDING=${UNEXPECTED:-0}

            if [ "$PENDING_RAW" != "$PENDING" ]; then
              echo "Changesets en attente (bruts) : $PENDING_RAW"
              echo "  dont attendus par conception : $((PENDING_RAW - PENDING)) (RLS dormante, runAlways)"
            fi

            echo ""
            echo "=========================================="
            echo "Summary"
            echo "=========================================="
            echo "Pending changesets : $PENDING"
            echo "Status RC          : $STATUS_RC"
            echo "Validate RC        : $VALIDATE_RC"
            echo "Lock state         : $LOCK_STATE"

            FAIL=0
            if [ "$PENDING" != "0" ]; then
              echo "::warning::$PENDING changeset(s) en attente d'application en prod."
              FAIL=1
            fi
            if [ "$VALIDATE_RC" != "0" ]; then
              echo "::error::liquibase validate a echoue (RC=$VALIDATE_RC) — checksum mismatch ou syntaxe invalide probable."
              FAIL=1
            fi
            if [ "$LOCK_STATE" = "t" ] || [ "$LOCK_STATE" = "true" ]; then
              echo "::warning::databasechangeloglock est verrouille — un Liquibase tourne ou un lock orphelin subsiste."
            fi

            if [ "$FAIL" != "0" ]; then
              echo ""
              echo "Action requise : revoir les ecarts ci-dessus, puis appliquer via"
              echo "le workflow 'Liquibase Bootstrap' (avec sync_tag adapte) si necessaire."
              exit 1
            fi

            echo ""
            echo "OK — la prod est en sync avec le master changelog."

            # ----------------------------------------------------------------
            # Sanity check : LiquibaseHealthIndicator (Phase 4)
            # ----------------------------------------------------------------
            # Verifie que l'indicator custom est bien embarque dans le binaire
            # deploye, en interrogeant /actuator/health depuis l'interieur du
            # reseau Docker (nginx bloque /actuator publiquement).
            #
            # Le payload detaille est protege par show-details=WHEN_AUTHORIZED
            # en prod — on ne peut donc pas lire le contenu du indicator sans
            # auth. Mais le code HTTP de la racine /actuator/health suffit :
            #   200 → app sait au moins repondre (au moins un indicator UP)
            #   503 → un indicator est DOWN → declencher PMS Server Diag
            #   non-joignable → app crashee ou en restart-loop
            echo ""
            echo "[8/8] LiquibaseHealthIndicator sanity check"

            HEALTH_CODE=$($DC exec -T pms-server sh -c \
              "curl -sf -o /dev/null -w '%{http_code}' --max-time 5 \
               http://localhost:8080/actuator/health" 2>/dev/null || echo "unreachable")

            echo "GET /actuator/health → HTTP $HEALTH_CODE"

            case "$HEALTH_CODE" in
              200)
                echo "OK — Spring Boot Actuator repond, tous les indicators sont UP."
                ;;
              503)
                echo "::warning::Un health indicator a fait passer /actuator/health en DOWN."
                echo "Declencher le workflow 'PMS Server Diag' pour les details."
                # Non bloquant : DB Status reste vert si la DB est sync. Le crash"
                # eventuel d'un autre indicator (mail, etc.) n'est pas notre scope.
                ;;
              unreachable|"")
                echo "::warning::pms-server ne repond pas (timeout / container down)."
                echo "Declencher 'PMS Server Diag' pour inspecter."
                ;;
              *)
                echo "::warning::Code HTTP inattendu sur /actuator/health: $HEALTH_CODE"
                ;;
            esac
