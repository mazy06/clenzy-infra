# Baitly: fixed diagnostics only, including nested exceptions.
# reload4j 1.2.25 (Kafka 3.6). PatternLayout alone appends throwables implicitly.
log4j.rootLogger=INFO, baitly
log4j.appender.baitly=org.apache.log4j.ConsoleAppender
log4j.appender.baitly.Target=System.out
log4j.appender.baitly.layout=org.apache.log4j.EnhancedPatternLayout
log4j.appender.baitly.layout.ConversionPattern={"diagnostic":"BAITLY_BROKER","level":"%p","timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}{UTC}"}%throwable{none}%n
