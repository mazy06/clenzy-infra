rule_files: ['../rules/baitly-recovery.yml']
evaluation_interval: 1m
tests:
  - name: expected OAuth fences and historical review are not incidents
    interval: 1m
    input_series:
      - series: 'up{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_last_success_timestamp_seconds{job="clenzy-backend",instance="backend:8080"}'
        values: '0+60x20'
      - series: 'baitly_recovery_accounting_unknown{job="clenzy-backend",instance="backend:8080"}'
        values: '0x20'
      - series: 'baitly_recovery_accounting_historical_review{job="clenzy-backend",instance="backend:8080"}'
        values: '999x20'
      - series: 'baitly_recovery_oauth_blocked_scopes{job="clenzy-backend",instance="backend:8080"}'
        values: '999x20'
    alert_rule_test:
      - {eval_time: 10m, alertname: BaitlyRecoveryMetricsUnavailable, exp_alerts: []}
      - {eval_time: 10m, alertname: BaitlyRecoveryMetricsStale, exp_alerts: []}
      - {eval_time: 10m, alertname: BaitlyAccountingExportStalled, exp_alerts: []}
      - {eval_time: 10m, alertname: BaitlyAccountingExportUncertain, exp_alerts: []}

  - name: missing recovery metrics on reachable backend are detected
    interval: 1m
    input_series:
      - series: 'up{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: BaitlyRecoveryMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: clenzy-backend, instance: 'backend:8080', severity: warning}
            exp_annotations:
              summary: "Collecte des journaux de reprise indisponible"
              description: "Vérifier version backend, migrations et collecte SQL. Un ancien compteur ne prouve pas une file saine."

  - name: missing heartbeat also makes recovery collection unavailable
    interval: 1m
    input_series:
      - series: 'up{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: BaitlyRecoveryMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: clenzy-backend, instance: 'backend:8080', severity: warning}
            exp_annotations:
              summary: "Collecte des journaux de reprise indisponible"
              description: "Vérifier version backend, migrations et collecte SQL. Un ancien compteur ne prouve pas une file saine."

  - name: database failure is detected and resolves after recovery
    interval: 1m
    input_series:
      - series: 'up{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="backend:8080"}'
        values: '0x3 1x16'
      - series: 'baitly_recovery_snapshot_last_success_timestamp_seconds{job="clenzy-backend",instance="backend:8080"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: BaitlyRecoveryMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: clenzy-backend, instance: 'backend:8080', severity: warning}
            exp_annotations:
              summary: "Collecte des journaux de reprise indisponible"
              description: "Vérifier version backend, migrations et collecte SQL. Un ancien compteur ne prouve pas une file saine."
      - {eval_time: 5m, alertname: BaitlyRecoveryMetricsUnavailable, exp_alerts: []}

  - name: stale samples produce a collection alert rather than financial alerts
    interval: 1m
    input_series:
      - series: 'up{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_last_success_timestamp_seconds{job="clenzy-backend",instance="backend:8080"}'
        values: '0x20'
      - series: 'baitly_recovery_accounting_unknown{job="clenzy-backend",instance="backend:8080"}'
        values: '2x20'
      - series: 'baitly_recovery_accounting_oldest_inflight_seconds{job="clenzy-backend",instance="backend:8080"}'
        values: '1000x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: BaitlyRecoveryMetricsStale
        exp_alerts:
          - exp_labels: {job: clenzy-backend, instance: 'backend:8080', severity: warning}
            exp_annotations:
              summary: "Journaux de reprise non rafraîchis"
              description: "Le dernier succès de collecte dépasse trois minutes. Examiner le collecteur avant de conclure sur les exports."
      - {eval_time: 8m, alertname: BaitlyAccountingExportStalled, exp_alerts: []}
      - {eval_time: 8m, alertname: BaitlyAccountingExportUncertain, exp_alerts: []}

  - name: unknown exports alert without rearming and resolve after proven reconciliation
    interval: 1m
    input_series:
      - series: 'up{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_last_success_timestamp_seconds{job="clenzy-backend",instance="backend:8080"}'
        values: '0+60x20'
      - series: 'baitly_recovery_accounting_unknown{job="clenzy-backend",instance="backend:8080"}'
        values: '1x5 0x14'
    alert_rule_test:
      - {eval_time: 4m, alertname: BaitlyAccountingExportUncertain, exp_alerts: []}
      - eval_time: 5m
        alertname: BaitlyAccountingExportUncertain
        exp_alerts:
          - exp_labels: {job: clenzy-backend, instance: 'backend:8080', severity: warning}
            exp_annotations:
              summary: "Résultat d’export comptable à rapprocher"
              description: "Un résultat non historique reste incertain. Rapprocher le bon compte et document, sans deuxième création ni effacement de preuve."
      - {eval_time: 7m, alertname: BaitlyAccountingExportUncertain, exp_alerts: []}

  - name: inflight exports require both age threshold and sustained duration
    interval: 1m
    input_series:
      - series: 'up{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="backend:8080"}'
        values: '1x20'
      - series: 'baitly_recovery_snapshot_last_success_timestamp_seconds{job="clenzy-backend",instance="backend:8080"}'
        values: '0+60x20'
      - series: 'baitly_recovery_accounting_oldest_inflight_seconds{job="clenzy-backend",instance="backend:8080"}'
        values: '1000x5 0x14'
    alert_rule_test:
      - {eval_time: 4m, alertname: BaitlyAccountingExportStalled, exp_alerts: []}
      - eval_time: 5m
        alertname: BaitlyAccountingExportStalled
        exp_alerts:
          - exp_labels: {job: clenzy-backend, instance: 'backend:8080', severity: warning}
            exp_annotations:
              summary: "Export comptable en cours depuis trop longtemps"
              description: "Une intention dépasse quinze minutes. Examiner le journal et la preuve distante ; ne pas réarmer un envoi."
      - {eval_time: 7m, alertname: BaitlyAccountingExportStalled, exp_alerts: []}

  - name: backend outage does not create duplicate recovery incidents
    interval: 1m
    input_series:
      - series: 'up{job="clenzy-backend",instance="backend:8080"}'
        values: '0x20'
      - series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="backend:8080"}'
        values: '0x20'
      - series: 'baitly_recovery_accounting_unknown{job="clenzy-backend",instance="backend:8080"}'
        values: '5x20'
    alert_rule_test:
      - {eval_time: 10m, alertname: BaitlyRecoveryMetricsUnavailable, exp_alerts: []}
      - {eval_time: 10m, alertname: BaitlyRecoveryMetricsStale, exp_alerts: []}
      - {eval_time: 10m, alertname: BaitlyAccountingExportStalled, exp_alerts: []}
      - {eval_time: 10m, alertname: BaitlyAccountingExportUncertain, exp_alerts: []}

  - name: deployment coverage detects partial rollout then accepts both complete replicas
    interval: 1m
    input_series:
      - {series: 'up{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'up{job="clenzy-backend",instance="b"}', values: '1x2'}
      - {series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_snapshot_last_success_timestamp_seconds{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_accounting_inflight{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_accounting_unknown{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_accounting_historical_review{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_accounting_oldest_inflight_seconds{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_accounting_oldest_unknown_seconds{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_oauth_blocked_scopes{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_snapshot_healthy{job="clenzy-backend",instance="b"}', values: '_ 1x1'}
      - {series: 'baitly_recovery_snapshot_last_success_timestamp_seconds{job="clenzy-backend",instance="b"}', values: '_ 1x1'}
      - {series: 'baitly_recovery_accounting_inflight{job="clenzy-backend",instance="b"}', values: '_ 1x1'}
      - {series: 'baitly_recovery_accounting_unknown{job="clenzy-backend",instance="b"}', values: '_ 1x1'}
      - {series: 'baitly_recovery_accounting_historical_review{job="clenzy-backend",instance="b"}', values: '_ 1x1'}
      - {series: 'baitly_recovery_accounting_oldest_inflight_seconds{job="clenzy-backend",instance="b"}', values: '_ 1x1'}
      - {series: 'baitly_recovery_accounting_oldest_unknown_seconds{job="clenzy-backend",instance="b"}', values: '_ 1x1'}
      - {series: 'baitly_recovery_oauth_blocked_scopes{job="clenzy-backend",instance="b"}', values: '_ 1x1'}
      - {series: 'baitly_recovery_minut_ready{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_minut_uncertain{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_minut_review{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_minut_oldest_ready_seconds{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_minut_oldest_uncertain_seconds{job="clenzy-backend",instance="a"}', values: '1x2'}
      - {series: 'baitly_recovery_minut_ready{job="clenzy-backend",instance="b"}', values: '_ _ 1'}
      - {series: 'baitly_recovery_minut_uncertain{job="clenzy-backend",instance="b"}', values: '_ _ 1'}
      - {series: 'baitly_recovery_minut_review{job="clenzy-backend",instance="b"}', values: '_ _ 1'}
      - {series: 'baitly_recovery_minut_oldest_ready_seconds{job="clenzy-backend",instance="b"}', values: '_ _ 1'}
      - {series: 'baitly_recovery_minut_oldest_uncertain_seconds{job="clenzy-backend",instance="b"}', values: '_ _ 1'}
    promql_expr_test:
      - expr: 'count((up{job="clenzy-backend"} == 1) unless on(job,instance) (count by(job,instance) ({job="clenzy-backend",__name__=~"baitly_recovery_(snapshot_healthy|snapshot_last_success_timestamp_seconds|accounting_inflight|accounting_unknown|accounting_historical_review|accounting_oldest_inflight_seconds|accounting_oldest_unknown_seconds|oauth_blocked_scopes|minut_ready|minut_uncertain|minut_review|minut_oldest_ready_seconds|minut_oldest_uncertain_seconds)"}) == 13)) or vector(0)'
        eval_time: 0m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: 'count((up{job="clenzy-backend"} == 1) unless on(job,instance) (count by(job,instance) ({job="clenzy-backend",__name__=~"baitly_recovery_(snapshot_healthy|snapshot_last_success_timestamp_seconds|accounting_inflight|accounting_unknown|accounting_historical_review|accounting_oldest_inflight_seconds|accounting_oldest_unknown_seconds|oauth_blocked_scopes|minut_ready|minut_uncertain|minut_review|minut_oldest_ready_seconds|minut_oldest_uncertain_seconds)"}) == 13)) or vector(0)'
        eval_time: 2m
        exp_samples: [{labels: '{}', value: 0}]
      - expr: 'count((up{job="clenzy-backend"} == 1) unless on(job,instance) (count by(job,instance) ({job="clenzy-backend",__name__=~"baitly_recovery_(snapshot_healthy|snapshot_last_success_timestamp_seconds|accounting_inflight|accounting_unknown|accounting_historical_review|accounting_oldest_inflight_seconds|accounting_oldest_unknown_seconds|oauth_blocked_scopes|minut_ready|minut_uncertain|minut_review|minut_oldest_ready_seconds|minut_oldest_uncertain_seconds)"}) == 13)) or vector(0)'
        eval_time: 1m
        exp_samples: [{labels: '{}', value: 1}]
