        values: "1x20"
      -
        series: "baitly_recovery_snapshot_last_success_timestamp_seconds{job=\"clenzy-backend\",instance=\"backend:8080\"}"
        values: "0x20"
      -
        series: "baitly_recovery_minut_ready{job=\"clenzy-backend\",instance=\"backend:8080\"}"
        values: "2x20"
      -
        series: "baitly_recovery_minut_uncertain{job=\"clenzy-backend\",instance=\"backend:8080\"}"
        values: "2x20"
      -
