        values: "999x20"
      -
        series: "baitly_recovery_minut_oldest_ready_seconds{job=\"clenzy-backend\",instance=\"backend:8080\"}"
        values: "1000x20"
      -
        series: "baitly_recovery_minut_oldest_uncertain_seconds{job=\"clenzy-backend\",instance=\"backend:8080\"}"
