        },
        {
          "series": "baitly_noise_warning_snapshot_healthy{job=\"clenzy-backend\",instance=\"b\"}",
          "values": "1x40"
        },
        {
          "series": "baitly_noise_warning_snapshot_last_success_timestamp_seconds{job=\"clenzy-backend\",instance=\"b\"}",
