{
  "rule_files": [
    "../rules/baitly-recovery.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "healthy empty warnings are not incidents",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "1x40"
        },
        {
          "series": "baitly_noise_warning_snapshot_healthy{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "1x40"
        },
        {
          "series": "baitly_noise_warning_snapshot_last_success_timestamp_seconds{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "0+60x40"
        },
        {
          "series": "baitly_noise_warning_uncertain{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "0x40"
        },
        {
          "series": "baitly_noise_warning_oldest_uncertain_seconds{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "0x40"
        },
        {
          "series": "baitly_noise_warning_repair_pending{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "0x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20m",
          "alertname": "BaitlyNoiseWarningMetricsUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "20m",
          "alertname": "BaitlyNoiseWarningUncertain",
          "exp_alerts": []
        },
        {
          "eval_time": "20m",
          "alertname": "BaitlyNoiseWarningRepairStalled",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "uncertain intent fires and resolves without rearming",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "1x40"
        },
        {
          "series": "baitly_noise_warning_snapshot_healthy{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "1x40"
        },
        {
          "series": "baitly_noise_warning_snapshot_last_success_timestamp_seconds{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "0+60x40"
        },
        {
          "series": "baitly_noise_warning_uncertain{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "1x5 0x34"
        },
        {
          "series": "baitly_noise_warning_oldest_uncertain_seconds{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "600x5 0x34"
        },
        {
          "series": "baitly_noise_warning_repair_pending{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "0x40"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "4m",
          "alertname": "BaitlyNoiseWarningUncertain",
          "exp_alerts": []
        },
        {
          "eval_time": "5m",
          "alertname": "BaitlyNoiseWarningUncertain",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "clenzy-backend",
                "instance": "backend:8080",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Notification bruit a rapprocher",
                "description": "Une tentative reste incertaine. Rapprocher sa preuve sans liberer l'intention ni envoyer sur un autre canal."
              }
            }
          ]
        },
        {
          "eval_time": "7m",
          "alertname": "BaitlyNoiseWarningUncertain",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "local proof backlog requires sustained time and resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"clenzy-backend\",instance=\"backend:8080\"}",
          "values": "1x40"
        },
        {
          "series": "baitly_noise_warning_snapshot_healthy{job=\"clenzy-backend\",instance=\"backend:8080\"}",
