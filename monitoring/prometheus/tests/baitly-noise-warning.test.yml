      "promql_expr_test": [
        {
          "expr": "count((up{job=\"clenzy-backend\"} == 1) unless on(job,instance) (count by(job,instance) ({job=\"clenzy-backend\",__name__=~\"baitly_noise_warning_(snapshot_healthy|snapshot_last_success_timestamp_seconds|uncertain|oldest_uncertain_seconds|repair_pending)\"}) == 5)) or vector(0)",
          "eval_time": "3m",
          "exp_samples": [
            {
              "labels": "{}",
              "value": 1
            }
          ]
        }
      ]
