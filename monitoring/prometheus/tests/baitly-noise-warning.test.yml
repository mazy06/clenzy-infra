      "name": "updated replica cannot hide missing warning gauge on another replica",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"clenzy-backend\",instance=\"a\"}",
          "values": "1x40"
        },
        {
          "series": "baitly_noise_warning_snapshot_healthy{job=\"clenzy-backend\",instance=\"a\"}",
          "values": "1x40"
        },
        {
          "series": "baitly_noise_warning_snapshot_last_success_timestamp_seconds{job=\"clenzy-backend\",instance=\"a\"}",
