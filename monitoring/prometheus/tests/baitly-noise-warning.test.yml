        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "14m",
          "alertname": "BaitlyNoiseWarningRepairStalled",
          "exp_alerts": []
        },
        {
          "eval_time": "15m",
          "alertname": "BaitlyNoiseWarningRepairStalled",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "clenzy-backend",
                "instance": "backend:8080",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Suivi local des avertissements en attente",
                "description": "La file de reparation reste non vide depuis quinze minutes. Verifier les marqueurs locaux, jamais renvoyer les messages acceptes."
              }
            }
          ]
        },
        {
          "eval_time": "22m",
          "alertname": "BaitlyNoiseWarningRepairStalled",
          "exp_alerts": []
        }
      ]
    },
