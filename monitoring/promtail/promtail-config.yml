server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collecte des logs de tous les conteneurs Docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: network
            values: ["clenzy-network"]
          - name: status
            values: ["running"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # Drop targets without a service label (prevents "no unique labels" errors)
      - source_labels: ['service']
        regex: ''
        action: drop
    pipeline_stages:
      # Fail closed for proxy/broker legacy output, native stderr and multiline causes.
      # Only source-generated technical schemas can reach Loki; no regex redaction of payloads.
      - match:
          selector: >-
            {service="kafka"} !~ "^\\{\"diagnostic\":\"BAITLY_BROKER\",\"level\":\"(?:TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\",\"timestamp\":\"[0-9TZ:.+-]+\"\\}\\z"
          action: drop
          drop_counter_reason: baitly_broker_unsafe_schema
      - match:
          selector: >-
            {service="nginx"} !~ "^\\{\"diagnostic\":\"BAITLY_PROXY_ACCESS\",\"timestamp\":\"[0-9T:.+-]+\",\"method\":\"(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|OTHER)\",\"path\":\"(?:/|/health|/baitly-config\\.js|/api/auth/(?:login|forgot-password|password-reset-email)|/\\[redacted\\]|/\\[sensitive-file-probe\\]|/(?:api|oidc|assets)/\\[redacted\\])\",\"status\":[1-5][0-9]{2},\"upstream_status\":\"[-0-9, :]+\",\"request_time\":[0-9]+\\.[0-9]+\\}\\z"
          action: drop
          drop_counter_reason: baitly_proxy_unsafe_schema
      # Parser JSON uniquement pour les logs Spring Boot (pms-server)
      - match:
          selector: '{service="pms-server"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger_name
                  message: message
                  thread: thread_name
            - labels:
                level:
                logger:
      # Low-cardinality status only; safe body has no IP, ray, host or raw URI.
      - match:
          selector: '{service="nginx"}'
          stages:
            - json:
                expressions:
                  http_status: status
            - labels:
                http_status:
